name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the installers and
# publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  linux:
    name: Linux packages
    # The oldest supported Ubuntu: the binary then runs on any distribution with glibc 2.35+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          # TEMPORARY (2026-11-11): Canonical's DNS is down, so use mirrors outside it first.
          # Remove after v0.1.0 is published.
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu/ https://mirror.math.princeton.edu/pub/ubuntu/ \
            https://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lychee
      - run: packaging/linux/build-packages.sh "${GITHUB_REF_NAME#v}" target/release/lychee dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lychee
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          choco upgrade innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\lychee.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = "dist\Lychee-$version-windows-x64-portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target\release\lychee.exe, README.md $portable
          Copy-Item LICENSE "$portable\LICENSE.txt"
          Compress-Archive -Path $portable -DestinationPath "$portable.zip"
          Remove-Item -Recurse $portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Lychee ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md

  report:
    # Agents can't see Actions on this private repository; they read the status/release branch.
    name: Report
    if: always()
    needs: [linux, windows, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/ci-report.sh status/release "Release $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
