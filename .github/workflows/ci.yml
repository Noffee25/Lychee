name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # TEMPORARY (2026-11-11): Canonical's DNS is down, so use mirrors outside it first.
          # Remove after v0.1.0 is published.
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu/ https://mirror.math.princeton.edu/pub/ubuntu/ \
            https://archive.ubuntu.com/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  report:
    # Agents can't see Actions on this private repository; they read the status/ci branch.
    name: Report
    if: always() && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/ci-report.sh status/ci "CI $(git log -1 --format=%h)"
        env:
          GH_TOKEN: ${{ github.token }}
