[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lychee"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/Noffee25/Lychee"
homepage = "https://github.com/Noffee25/Lychee"

[workspace.dependencies]
lychee-core = { path = "crates/lychee-core" }
lychee-audio = { path = "crates/lychee-audio" }
lychee-library = { path = "crates/lychee-library" }
lychee-lastfm = { path = "crates/lychee-lastfm" }
lychee-platform = { path = "crates/lychee-platform" }
lychee-tagger = { path = "crates/lychee-tagger" }
lychee-lookup = { path = "crates/lychee-lookup" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
directories = "6"

[profile.dev.package."*"]
# Decoding, tag reading and image resizing are painfully slow unoptimized.
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The app crate is mostly UI code generated from the .slint files: optimise it for size.
# Decoding, resampling and tag reading live in the other crates and stay at full speed.
[profile.release.package.lychee]
opt-level = "s"
