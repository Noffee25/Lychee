<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lychee: Folio (design direction B)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2EEE6; --bg-2: #E8E2D6; --ink: #161412; --ink-2: #5C564D; --ink-3: #9A9286; --rule: #D3CBBD; --accent: #CC2B3B;
  --serif: 'Instrument Serif', 'Times New Roman', serif;
  --sans: 'Instrument Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --pad: clamp(28px, 3.4vw, 52px);
}
.ink { --bg: #121110; --bg-2: #1B1A17; --ink: #EEE8DD; --ink-2: #A59D90; --ink-3: #6E675D; --rule: #2E2B27; --accent: #FF5463; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; transition: background .4s, color .4s; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.shot *, .shot *::before, .shot *::after { animation: none !important; transition: none !important; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

.shell { display: grid; grid-template-rows: 64px 1fr auto; height: 100%; }

/* Masthead */
.mast { display: grid; grid-template-columns: minmax(200px, 1fr) auto minmax(200px, 1fr); gap: 24px; align-items: center; padding: 0 var(--pad); border-bottom: 1px solid var(--rule); }
.word { display: flex; align-items: center; gap: 10px; font: italic 400 30px/1 var(--serif); letter-spacing: -.01em; }
.word small { font: 400 10.5px var(--mono); letter-spacing: .08em; color: var(--ink-3); font-style: normal; margin-left: 4px; text-transform: uppercase; }
.nav { display: flex; gap: 28px; justify-content: center; }
.nav a.np-link::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 2px; }
.nav a { position: relative; color: var(--ink-2); text-decoration: none; font-size: 14.5px; font-weight: 500; cursor: pointer; padding: 6px 0; transition: color .2s; }
.nav a sup { font: 400 9.5px var(--mono); margin-left: 2px; color: var(--ink-3); vertical-align: 6px; }
.nav a:hover { color: var(--ink); }
.nav a.on { color: var(--ink); }
.nav a.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--accent); }
.mast-r { display: flex; align-items: center; justify-content: flex-end; gap: 18px; }
.search { display: flex; align-items: center; gap: 10px; color: var(--ink-3); border-bottom: 1px solid var(--rule); padding: 6px 2px; width: 220px; }
.search span { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search kbd { font: 400 10px var(--mono); letter-spacing: .04em; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 5px; }
.tbtn { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--ink-2); transition: background .2s, color .2s; }
.tbtn:hover { background: var(--bg-2); color: var(--ink); }
.wc { display: flex; gap: 4px; margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--rule); }
.wc button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink-2); border-radius: 4px; }
.wc button:hover { background: var(--bg-2); color: var(--ink); }

/* Pages */
.pages { position: relative; min-height: 0; }
.page { position: absolute; inset: 0; overflow: auto; padding: 0 var(--pad); transition: opacity .45s var(--ease), transform .55s var(--ease); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.view-now .page.lib, .view-lib .page.now { opacity: 0; transform: translateY(14px); pointer-events: none; }

.head { display: grid; grid-template-columns: auto 1fr auto; gap: 40px; align-items: end; padding: 34px 0 26px; border-bottom: 1px solid var(--ink); }
.head h1 { margin: 0; font: 400 132px/.8 var(--serif); letter-spacing: -.025em; }
.head .dek { font: italic 400 22px/1.25 var(--serif); color: var(--ink-2); max-width: 340px; padding-bottom: 6px; }
.facts { display: grid; grid-template-columns: auto auto; gap: 4px 22px; padding-bottom: 8px; }
.facts dt { font: 400 10.5px var(--mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.facts dd { margin: 0; font: 500 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); margin-bottom: 30px; }
.opts { display: flex; align-items: baseline; gap: 16px; }
.opts .mono { color: var(--ink-3); margin-right: 4px; }
.opts button { font-size: 14px; color: var(--ink-2); padding: 2px 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.opts button:hover { color: var(--ink); }
.opts button.on { color: var(--ink); border-color: var(--ink); }
.opts i.sep { font-style: normal; color: var(--rule); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); gap: 40px 30px; padding-bottom: 48px; }
.item { cursor: pointer; }
.item .cv { position: relative; aspect-ratio: 1; transition: transform .35s var(--ease), box-shadow .35s var(--ease); box-shadow: 0 1px 0 rgba(0,0,0,.04); }
.item .cv img { width: 100%; height: 100%; display: block; }
.item .cv::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.item:hover .cv { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
.cap { margin-top: 12px; }
.cap .no { display: flex; justify-content: space-between; color: var(--ink-3); }
.cap .no .play { color: var(--accent); opacity: 0; transition: opacity .2s; }
.item:hover .cap .no .play { opacity: 1; }
.cap h3 { margin: 6px 0 2px; font: 400 24px/1.05 var(--serif); letter-spacing: -.005em; }
.cap p { margin: 0; color: var(--ink-2); font-size: 13px; }
.item.playing .cap .no .n { color: var(--accent); }
.item.playing .cap .no .n::before { content: '\25CF\00a0'; }

/* Now playing spread */
.spread { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr); gap: clamp(32px, 4.5vw, 72px); padding: 34px 0 30px; min-height: 100%; align-items: start; }
.fig img { width: 100%; max-width: min(560px, calc(100vh - 300px)); aspect-ratio: 1; display: block; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 30px 60px -40px rgba(0,0,0,.5); }
.fig figcaption { margin-top: 14px; color: var(--ink-3); max-width: 560px; line-height: 1.7; }
.fig figcaption b { color: var(--ink); font-weight: 500; }
.kicker { color: var(--accent); display: flex; gap: 14px; align-items: center; }
.kicker::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.spread h2 { margin: 18px 0 10px; font: 400 clamp(64px, 6.6vw, 104px)/.9 var(--serif); letter-spacing: -.03em; }
.byline { font: italic 400 23px/1.3 var(--serif); color: var(--ink-2); margin: 0 0 26px; }
.byline a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); font-style: normal; }
.quote { position: relative; margin: 0 0 28px; padding: 22px 0 24px 34px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font: italic 400 34px/1.15 var(--serif); letter-spacing: -.01em; }
.quote::before { content: '\201C'; position: absolute; left: -4px; top: 10px; font: 400 76px/1 var(--serif); color: var(--accent); }
.quote small { display: block; margin-top: 10px; font: 400 10.5px var(--mono); letter-spacing: .08em; color: var(--ink-3); font-style: normal; text-transform: uppercase; }
.cols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 36px; }
.cols h4 { margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); font-weight: 400; }
.index { list-style: none; margin: 0; padding: 0; }
.index li { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; cursor: pointer; font-size: 14.5px; transition: color .2s; }
.index li:hover { color: var(--accent); }
.index .n { font: 400 11px var(--mono); color: var(--ink-3); width: 20px; }
.index .lead { flex: 1; border-bottom: 1px dotted var(--ink-3); opacity: .55; transform: translateY(-4px); min-width: 20px; }
.index .d { font: 400 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.index li.cur { color: var(--accent); }
.index li.cur .ti { font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1; }
.index li.cur .n { color: var(--accent); }
.notes { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; }
.notes dt { font: 400 10.5px var(--mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; padding-top: 2px; }
.notes dd { margin: 0; font-size: 13.5px; text-align: right; }

/* Transport */
.transport { border-top: 1px solid var(--ink); display: grid; grid-template-columns: minmax(250px, 1fr) auto minmax(320px, 1.3fr) auto; align-items: center; gap: 34px; padding: 14px var(--pad); background: var(--bg); transition: padding .5s var(--ease); }
.np { display: flex; align-items: center; gap: 14px; min-width: 0; cursor: pointer; }
.np img { width: 46px; height: 46px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.np .t { font: 400 21px/1.05 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np .s { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ctrl { display: flex; align-items: center; gap: 6px; }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); transition: color .2s, background .2s; }
.ib:hover { color: var(--ink); background: var(--bg-2); }
.ib.on { color: var(--accent); }
.pbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); margin: 0 6px; transition: transform .15s var(--ease), background .2s; }
.pbtn:hover { background: var(--accent); color: #fff; }
.pbtn:active { transform: scale(.94); }
.time { display: flex; align-items: center; gap: 14px; }
.time .tc { font: 400 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.line { position: relative; flex: 1; height: 14px; cursor: pointer; }
.line::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--ink-3); opacity: .6; }
.line .fill { position: absolute; left: 0; top: calc(50% - 1px); height: 2px; background: var(--ink); }
.line .phead { position: absolute; top: 0; width: 1.5px; height: 14px; background: var(--accent); }
.line:hover .fill { background: var(--accent); }
.side { display: flex; align-items: center; gap: 18px; }
.side .fmt { color: var(--ink-3); white-space: nowrap; }
.side .tl { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; transition: color .2s; }
.side .tl:hover { color: var(--ink); }
.side .tl sup { font: 400 9.5px var(--mono); color: var(--accent); margin-left: 1px; }
.vol { display: flex; align-items: flex-end; gap: 3px; height: 16px; cursor: pointer; }
.vol span { width: 2px; background: var(--rule); }
.vol span.on { background: var(--ink); }

/* In the Now Playing view the transport becomes a large timeline */
.view-now .transport { grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; gap: 6px 28px; padding: 10px var(--pad) 18px; }
.view-now .np { display: none; }
.view-now .time { grid-column: 1 / -1; grid-row: 1; gap: 26px; }
.view-now .time .tc { font: 400 54px/1 var(--serif); color: var(--ink); letter-spacing: -.02em; }
.view-now .time .tc.rem { color: var(--ink-3); }
.view-now .line { height: 30px; }
.view-now .line .phead { height: 30px; }
.view-now .ctrl { grid-row: 2; grid-column: 1; }
.view-now .side { grid-row: 2; grid-column: 3; }
@media (max-width: 1240px) { .side .fmt { display: none; } .nav { gap: 20px; } .search { width: 180px; } }
</style>
</head>
<body class="view-lib">
<div class="shell">
  <header class="mast">
    <div class="word" id="word"></div>
    <nav class="nav">
      <a class="on" data-go="lib">Albums<sup>214</sup></a><a>Artists<sup>88</sup></a><a>Tracks<sup>2931</sup></a><a>Genres<sup>23</sup></a><a>Playlists<sup>12</sup></a><a data-go="now" class="np-link">Now Playing</a>
    </nav>
    <div class="mast-r">
      <div class="search"><i data-i="search" data-s="16"></i><span>Search records</span><kbd>CTRL K</kbd></div>
      <button class="tbtn" id="theme" title="Paper / Ink"><i data-i="moon" data-s="16"></i></button>
      <div class="wc"><button><i data-i="minus" data-s="15"></i></button><button><i data-i="square" data-s="13"></i></button><button><i data-i="x" data-s="15"></i></button></div>
    </div>
  </header>

  <div class="pages">
    <section class="page lib">
      <div class="head">
        <h1>Albums</h1>
        <div class="dek">Two hundred and fourteen records, catalogued in the order they arrived.</div>
        <dl class="facts"><dt>Records</dt><dd>214</dd><dt>Tracks</dt><dd>2,931</dd><dt>Running time</dt><dd>8 d 4 h</dd><dt>Lossless</dt><dd>71%</dd></dl>
      </div>
      <div class="toolbar">
        <div class="opts"><span class="mono">Sort</span><button class="on">Recently added</button><i class="sep">/</i><button>Artist</button><i class="sep">/</i><button>Title</button><i class="sep">/</i><button>Year</button></div>
        <div class="opts"><span class="mono">Show</span><button class="on">All</button><i class="sep">/</i><button>Lossless</button><i class="sep">/</i><button>Hi-Res</button><i class="sep">/</i><button>Unplayed</button></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="page now">
      <div class="spread">
        <figure class="fig" style="margin:0">
          <img id="bigArt" alt="">
          <figcaption class="mono" id="figcap"></figcaption>
        </figure>
        <div>
          <div class="kicker mono" id="kicker"></div>
          <h2 id="title"></h2>
          <p class="byline" id="byline"></p>
          <blockquote class="quote" id="quote"></blockquote>
          <div class="cols">
            <div><h4 class="mono">Index</h4><ol class="index" id="index"></ol></div>
            <div><h4 class="mono">Notes</h4><dl class="notes" id="notes"></dl></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="transport">
    <div class="np" data-go="now"><img id="npArt" alt=""><div style="min-width:0"><div class="t" id="npTitle"></div><div class="s" id="npSub"></div></div></div>
    <div class="ctrl">
      <button class="ib" data-act="shuffle"><i data-i="shuffle" data-s="17"></i></button>
      <button class="ib" data-act="prev"><i data-i="prev" data-s="19"></i></button>
      <button class="pbtn" data-act="toggle" id="pp"></button>
      <button class="ib" data-act="next"><i data-i="next" data-s="19"></i></button>
      <button class="ib on" data-act="repeat"><i data-i="repeat" data-s="17"></i></button>
    </div>
    <div class="time"><span class="tc" id="tCur"></span><div class="line" id="seek"><div class="fill" id="fill"></div><div class="phead" id="phead"></div></div><span class="tc rem" id="tRem"></span></div>
    <div class="side">
      <span class="fmt mono" id="fmt"></span>
      <button class="tl" data-go="now">Lyrics</button>
      <button class="tl">Queue<sup>8</sup></button>
      <div class="vol" id="vol" title="Volume 72%"></div>
    </div>
  </footer>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/covers.js"></script>
<script src="../shared/icons.js"></script>
<script>
(function () {
  const L = LYCHEE, $ = s => document.querySelector(s), body = document.body;
  const shot = L.params.has('shot');
  if (shot) document.documentElement.classList.add('shot');
  if (L.params.get('theme') === 'ink') document.documentElement.classList.add('ink');
  const S = Object.assign({}, L.state);
  let album = L.album(S.albumId), tracks = L.tracksFor(album);

  $('#word').innerHTML = 'Lychee<small>Music Library</small>';
  $('#grid').innerHTML = L.albums.map((a, i) => `<div class="item" data-id="${a.id}">
      <div class="cv"><img src="${L.coverURL(a)}" alt="" loading="lazy"></div>
      <div class="cap"><div class="no mono"><span class="n">Nº ${String(L.albums.length - i).padStart(3, '0')}</span><span class="play">Play ▸</span><span class="y">${a.year}</span></div>
      <h3>${L.esc(a.title)}</h3><p>${L.esc(a.artist)}</p></div></div>`).join('');
  $('#vol').innerHTML = Array.from({ length: 12 }, (_, i) => `<span style="height:${5 + i}px" class="${i < 9 ? 'on' : ''}"></span>`).join('');
  document.querySelectorAll('.no .y').forEach(y => y.style.display = 'inline');

  function render() {
    const t = tracks[S.trackIndex], url = L.coverURL(album);
    $('#npArt').src = url; $('#bigArt').src = url;
    $('#npTitle').textContent = t.title; $('#npSub').textContent = `${album.artist} — ${album.title}`;
    $('#fmt').textContent = `${album.format} ${album.short}`;
    $('#kicker').innerHTML = `<span>Now playing</span><span>Track ${String(t.n).padStart(2, '0')} of ${String(tracks.length).padStart(2, '0')}</span>`;
    $('#title').textContent = t.title;
    $('#byline').innerHTML = `by <a href="#">${L.esc(album.artist)}</a>, from the album <a href="#">${L.esc(album.title)}</a> (${album.year})`;
    $('#figcap').innerHTML = `Fig. 1 — <b>${L.esc(album.title)}</b>, ${L.esc(album.artist)}. ${L.esc(album.label)}, ${album.year}. ${album.tracks} tracks, ${album.minutes} min. Cat. ${album.code}.`;
    $('#index').innerHTML = tracks.map((x, i) => `<li data-i="${i}" class="${i === S.trackIndex ? 'cur' : ''}"><span class="n">${String(x.n).padStart(2, '0')}</span><span class="ti">${L.esc(x.title)}</span><span class="lead"></span><span class="d">${L.fmt(x.len)}</span></li>`).join('');
    const notes = [['Format', album.format], ['Resolution', album.res], ['Bitrate', album.kbps.toLocaleString('en-US') + ' kbps'], ['Genre', album.genre], ['Label', album.label], ['Released', album.year], ['Plays', t.plays], ['Added', album.added]];
    $('#notes').innerHTML = notes.map(([k, v]) => `<dt>${k}</dt><dd>${L.esc(v)}</dd>`).join('');
    document.querySelectorAll('.item').forEach(el => el.classList.toggle('playing', el.dataset.id === album.id));
    tick();
  }
  function quoteLine() {
    const t = tracks[S.trackIndex];
    if (album.id !== 'tidal-memory' || t.title !== 'Saltwater Hymn') return null;
    let cur = L.lyrics[0]; L.lyrics.forEach(l => { if (l.t <= S.position) cur = l; });
    return cur;
  }
  let lastQuote = '';
  function tick() {
    const t = tracks[S.trackIndex], pct = Math.min(1, S.position / t.len);
    $('#tCur').textContent = L.fmt(S.position); $('#tRem').textContent = '−' + L.fmt(t.len - S.position);
    $('#fill').style.width = pct * 100 + '%'; $('#phead').style.left = pct * 100 + '%';
    const q = quoteLine(), html = q ? `${L.esc(q.text)}<small>Lyric · ${L.fmt(q.t)}, synced from saltwater-hymn.lrc</small>` : `No lyrics yet for this track.<small>Lychee reads embedded lyrics and .lrc files</small>`;
    if (html !== lastQuote) { $('#quote').innerHTML = html; lastQuote = html; }
  }
  function renderPlay() { $('#pp').innerHTML = L.icon(S.playing ? 'pause' : 'play', { size: 19 }); }
  function go(v) { body.classList.toggle('view-now', v === 'now'); body.classList.toggle('view-lib', v !== 'now');
    document.querySelectorAll('.nav a[data-go]').forEach(a => a.classList.toggle('on', a.dataset.go === v)); }

  document.addEventListener('click', e => {
    const item = e.target.closest('.item');
    if (item) { album = L.album(item.dataset.id); tracks = L.tracksFor(album); S.trackIndex = 0; S.position = 0; S.playing = true; renderPlay(); render(); return; }
    const li = e.target.closest('.index li'); if (li) { S.trackIndex = +li.dataset.i; S.position = 0; render(); return; }
    const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'toggle') { S.playing = !S.playing; renderPlay(); }
    if (a === 'next') { S.trackIndex = (S.trackIndex + 1) % tracks.length; S.position = 0; render(); }
    if (a === 'prev') { if (S.position > 3) S.position = 0; else { S.trackIndex = (S.trackIndex - 1 + tracks.length) % tracks.length; S.position = 0; } render(); }
    if (a === 'shuffle' || a === 'repeat') b.classList.toggle('on');
  });
  $('#seek').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); S.position = (e.clientX - r.left) / r.width * tracks[S.trackIndex].len; tick(); });
  $('#theme').addEventListener('click', () => document.documentElement.classList.toggle('ink'));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); S.playing = !S.playing; renderPlay(); }
    if (e.key === 'Escape') go('lib');
  });

  L.hydrateIcons(document, { stroke: 1.35 });
  renderPlay(); render();
  if (L.params.get('view') === 'now') go('now');
  if (!shot) setInterval(() => { if (!S.playing) return; S.position += 0.25; if (S.position >= tracks[S.trackIndex].len) { S.trackIndex = (S.trackIndex + 1) % tracks.length; S.position = 0; render(); } tick(); }, 250);
})();
</script>
</body>
</html>
