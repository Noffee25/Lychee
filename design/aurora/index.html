<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lychee: Aurora (design direction A)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #FF7A5C;
  --tint: #1B3A55;
  --text: rgba(255,255,255,.96);
  --text-2: rgba(255,255,255,.70);
  --text-3: rgba(255,255,255,.46);
  --glass: rgba(255,255,255,.075);
  --glass-hi: rgba(255,255,255,.13);
  --glass-border: rgba(255,255,255,.13);
  --r-l: 24px; --r-m: 16px; --r-s: 11px;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 500 14px/1.4 var(--font); color: var(--text); background: #0b0d14; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.shot *, .shot *::before, .shot *::after { animation: none !important; transition: none !important; }

/* Backdrop: the current cover, blurred, saturated and slowly drifting */
.backdrop { position: fixed; inset: 0; overflow: hidden; background: var(--tint); transition: background 1.2s var(--ease); }
.backdrop .art { position: absolute; inset: -25%; background-size: cover; background-position: center; filter: blur(100px) saturate(2.1) contrast(1.05); opacity: 0; transition: opacity 1.4s var(--ease); animation: drift 70s ease-in-out infinite alternate; }
.backdrop .art.on { opacity: .95; }
.backdrop .glow { position: absolute; inset: 0; background:
  radial-gradient(55% 60% at 88% 8%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%),
  radial-gradient(60% 70% at 0% 100%, color-mix(in srgb, var(--tint) 85%, transparent), transparent 70%);
  mix-blend-mode: soft-light; opacity: .9; transition: background 1.2s; }
@keyframes drift { from { transform: scale(1.05) rotate(0deg); } to { transform: scale(1.3) rotate(10deg) translate(-3%, 2%); } }
.backdrop .shade { position: absolute; inset: 0; background:
  radial-gradient(110% 80% at 15% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,.22) 55%, rgba(0,0,0,.5) 100%),
  linear-gradient(180deg, rgba(6,8,16,.18), rgba(6,8,16,.5)); transition: opacity .6s; }
.view-now .backdrop .shade { opacity: .55; }
.backdrop .grain { position: absolute; inset: 0; opacity: .09; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }

.glass { background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(28px) saturate(1.4); box-shadow: 0 18px 50px -20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10); }

/* App shell */
.app { position: fixed; inset: 0; display: grid; grid-template-columns: 252px 1fr; grid-template-rows: 1fr auto; gap: 12px; padding: 12px; transition: opacity .5s var(--ease), transform .6s var(--ease), filter .6s; }
.view-now .app { opacity: 0; transform: scale(.97); filter: blur(6px); pointer-events: none; }

/* Sidebar */
.sidebar { border-radius: var(--r-l); padding: 18px 12px 12px; display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.search { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); color: var(--text-3); margin-bottom: 14px; transition: background .2s; }
.search:hover { background: rgba(255,255,255,.11); }
.search span { flex: 1; text-align: left; }
kbd { font: 600 11px var(--font); padding: 3px 6px; border-radius: 6px; background: rgba(255,255,255,.1); color: var(--text-2); }
.nav a, .playlists a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; color: var(--text-2); text-decoration: none; cursor: pointer; transition: background .2s, color .2s; }
.nav a:hover, .playlists a:hover { background: rgba(255,255,255,.07); color: var(--text); }
.nav a.active { background: var(--glass-hi); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.nav a .ic { opacity: .9; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
.section-label { display: flex; align-items: center; justify-content: space-between; margin: 20px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--text-3); }
.section-label button { color: var(--text-3); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 7px; }
.section-label button:hover { background: rgba(255,255,255,.1); color: var(--text); }
.playlists a { padding: 7px 8px; }
.pl-art { width: 36px; height: 36px; border-radius: 9px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; flex: none; box-shadow: 0 4px 12px -4px rgba(0,0,0,.5); }
.pl-art img { width: 100%; height: 100%; display: block; }
.pl-art.liked { display: grid; place-items: center; grid-template-columns: 1fr; background: linear-gradient(135deg, var(--accent), #7A5CFF); color: #fff; }
.pl-name { display: flex; flex-direction: column; min-width: 0; color: var(--text); font-weight: 600; font-size: 13.5px; }
.pl-name small { color: var(--text-3); font-weight: 500; font-size: 12px; }
.sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 12px 8px 2px; border-top: 1px solid rgba(255,255,255,.08); }
.lib-status { flex: 1; display: flex; flex-direction: column; font-size: 12.5px; font-weight: 600; }
.lib-status small { color: var(--text-3); font-weight: 500; font-size: 11.5px; }
.lib-status b { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5BE49B; box-shadow: 0 0 10px #5BE49B; margin-right: 7px; vertical-align: 1px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; color: var(--text-2); transition: background .2s, color .2s, transform .15s; }
.icon-btn:hover { background: rgba(255,255,255,.1); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.on { color: var(--accent); }

/* Main column */
.main { min-height: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 20px; flex: none; }
.circle { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); color: var(--text-2); transition: background .2s, color .2s; }
.circle:hover { background: rgba(255,255,255,.16); color: var(--text); }
.spacer { flex: 1; }
.wc { display: flex; gap: 2px; }
.wc button { width: 34px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--text-2); }
.wc button:hover { background: rgba(255,255,255,.12); color: var(--text); }
.wc button.close:hover { background: #E5484D; color: #fff; }
.page { flex: 1; overflow: auto; padding: 8px 24px 24px 20px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 20px), transparent); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 10px 0 18px; }
h1 { font-size: 46px; line-height: 1; font-weight: 800; letter-spacing: -.04em; margin: 0 0 10px; }
.page-head p { margin: 0; color: var(--text-2); font-size: 14px; }
.head-actions { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); color: var(--text-2); font-weight: 600; font-size: 13px; transition: background .2s, color .2s; }
.pill:hover { background: rgba(255,255,255,.14); color: var(--text); }
.seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); }
.seg button { width: 34px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--text-3); }
.seg button.on { background: rgba(255,255,255,.9); color: #111; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.chip { padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--text-2); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.07); transition: all .2s; }
.chip:hover { color: var(--text); background: rgba(255,255,255,.13); }
.chip.on { background: #fff; color: #111; border-color: #fff; }

/* Album grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 26px 22px; }
.card { cursor: pointer; }
.card .cv { position: relative; border-radius: var(--r-m); aspect-ratio: 1; box-shadow: 0 14px 30px -14px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.2); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.card .cv img { width: 100%; height: 100%; display: block; border-radius: inherit; }
.card .cv::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); pointer-events: none; }
.card:hover .cv { transform: translateY(-5px); box-shadow: 0 26px 40px -18px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.2); }
.card .playfab { position: absolute; right: 10px; bottom: 10px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #111; box-shadow: 0 8px 20px rgba(0,0,0,.35); opacity: 0; transform: translateY(8px) scale(.9); transition: all .3s var(--ease); }
.card:hover .playfab { opacity: 1; transform: none; }
.card .eqbadge { position: absolute; left: 10px; bottom: 10px; display: none; align-items: flex-end; gap: 2px; height: 26px; padding: 6px 8px; border-radius: 9px; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); }
.card.playing .eqbadge { display: flex; }
.eqbadge span { width: 3px; border-radius: 2px; background: var(--accent); animation: eq 1s ease-in-out infinite alternate; }
.eqbadge span:nth-child(1) { height: 60%; animation-delay: -.3s; } .eqbadge span:nth-child(2) { height: 100%; animation-delay: -.7s; } .eqbadge span:nth-child(3) { height: 45%; animation-delay: -.1s; }
@keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
.eqbadge span { transform-origin: bottom; }
.card .t { margin-top: 12px; font-weight: 700; font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .a { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.hr { font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 5px; border-radius: 5px; background: rgba(255,255,255,.14); color: var(--text); }
.card.playing .t { color: var(--accent); }

/* Dock */
.dock { grid-column: 1 / -1; border-radius: var(--r-l); height: 84px; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(380px, 1.6fr) minmax(240px, 1fr); align-items: center; padding: 0 16px 0 12px; gap: 16px; }
.np { display: flex; align-items: center; gap: 14px; min-width: 0; }
.np-art { width: 58px; height: 58px; border-radius: 13px; overflow: hidden; flex: none; box-shadow: 0 10px 20px -8px rgba(0,0,0,.6); transition: transform .25s var(--ease); }
.np-art:hover { transform: scale(1.05); }
.np-art img { width: 100%; height: 100%; display: block; }
.np-meta { min-width: 0; }
.np-title { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.np-artist { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.transport { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.controls { display: flex; align-items: center; gap: 10px; }
.play { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #0f0f14; box-shadow: 0 6px 18px -4px rgba(0,0,0,.4); transition: transform .15s var(--ease); }
.play:hover { transform: scale(1.06); }
.play:active { transform: scale(.94); }
.progress { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; }
.progress .t { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; width: 36px; text-align: center; }
.bar { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); cursor: pointer; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: linear-gradient(90deg, rgba(255,255,255,.85), #fff); }
.bar .knob { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%) scale(0); box-shadow: 0 0 0 4px rgba(255,255,255,.18), 0 2px 8px rgba(0,0,0,.4); transition: transform .2s var(--ease); }
.progress:hover .knob { transform: translate(-50%, -50%) scale(1); }
.progress:hover .bar .fill { background: var(--accent); }
.extras { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 8px; border-radius: 7px; color: var(--text); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.1); margin-right: 8px; white-space: nowrap; }
.vol { display: flex; align-items: center; gap: 8px; width: 130px; color: var(--text-2); padding: 0 6px; }
.vol .bar { height: 4px; }
.vol .bar .fill { background: rgba(255,255,255,.85); }

/* Now Playing */
.now { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding: 12px 20px 28px; opacity: 0; pointer-events: none; transform: scale(1.03); transition: opacity .55s var(--ease), transform .7s var(--ease); }
.view-now .now { opacity: 1; pointer-events: auto; transform: none; }
.now-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 44px; }
.now-top .from { text-align: center; line-height: 1.25; }
.now-top .from small { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; color: var(--text-3); }
.now-top .from b { font-size: 13.5px; }
.now-top .right { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.now-body { display: grid; grid-template-columns: minmax(380px, 520px) minmax(0, 1fr); gap: clamp(40px, 6vw, 110px); align-items: center; padding: 0 clamp(20px, 5vw, 90px); min-height: 0; }
.now-left { display: flex; flex-direction: column; gap: 22px; }
.now-left > * { position: relative; z-index: 1; }
.now-left > .big-art { z-index: 0; }
.big-art { position: relative; width: 100%; aspect-ratio: 1; max-height: 44vh; max-width: 44vh; align-self: center; }
.big-art img { width: 100%; height: 100%; display: block; border-radius: 22px; position: relative; z-index: 1; box-shadow: 0 40px 80px -30px rgba(0,0,0,.7); }
.big-art .halo { position: absolute; inset: 8% 6% -6%; border-radius: 30px; background-size: cover; filter: blur(46px) saturate(1.8); opacity: .75; z-index: 0; }
.now-meta { display: flex; align-items: center; gap: 16px; }
.now-meta > div:first-child { flex: 1; min-width: 0; }
.now-meta h2 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-meta p { margin: 6px 0 0; color: var(--text-2); font-size: 16px; font-weight: 600; }
.now-meta p a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
.now-meta p a:hover { border-color: currentColor; }
.acts { display: flex; gap: 8px; }
.acts .circle { width: 40px; height: 40px; }
.acts .circle.on { color: var(--accent); }
.wave { display: flex; align-items: center; gap: 2px; height: 46px; cursor: pointer; }
.wave span { flex: 1; border-radius: 3px; background: rgba(255,255,255,.26); transition: background .3s; min-height: 3px; }
.wave span.past { background: #fff; }
.wave:hover span.past { background: var(--accent); }
.times { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.times .fmt { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.1); color: var(--text); }
.big-controls { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.big-controls .icon-btn { width: 48px; height: 48px; border-radius: 14px; }
.big-controls .play { width: 74px; height: 74px; }
.now-foot { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
.now-foot .vol { flex: 1; width: auto; }
.device { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.now-right { height: 100%; min-height: 0; display: flex; flex-direction: column; padding-top: 6px; }
.tabs { align-self: flex-start; display: flex; gap: 2px; padding: 4px; border-radius: 999px; margin-bottom: 6px; }
.tabs button { padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--text-2); }
.tabs button.on { background: rgba(255,255,255,.92); color: #111; }
.lyrics { position: relative; flex: 1; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 70%, transparent); mask-image: linear-gradient(180deg, transparent, #000 18%, #000 70%, transparent); }
.lyrics .inner { position: absolute; left: 0; right: 0; top: 0; transition: transform .8s var(--ease); }
.lyrics p { margin: 0; padding: 9px 0; font-size: clamp(24px, 2.4vw, 34px); line-height: 1.22; font-weight: 800; letter-spacing: -.025em; color: rgba(255,255,255,.30); transition: color .5s, transform .5s var(--ease), filter .5s; transform-origin: left center; cursor: pointer; text-wrap: balance; }
.lyrics p:hover { color: rgba(255,255,255,.6); }
.lyrics p.past { color: rgba(255,255,255,.22); filter: blur(.4px); }
.lyrics p.cur { color: #fff; transform: scale(1.025); text-shadow: 0 0 30px rgba(255,255,255,.25); }
.lyrics .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: left; gap: 12px; color: var(--text-2); }
.lyrics .empty b { font-size: 28px; color: var(--text); letter-spacing: -.02em; }
.queue-list { display: none; flex-direction: column; gap: 4px; overflow: auto; }
.view-queue .lyrics { display: none; } .view-queue .queue-list { display: flex; }
.q { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; }
.q:hover { background: rgba(255,255,255,.08); }
.q img { width: 46px; height: 46px; border-radius: 10px; }
.q div { flex: 1; min-width: 0; } .q b { display: block; font-size: 14.5px; } .q span { color: var(--text-2); font-size: 13px; }
.q time { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.q-head { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 14px 10px 4px; }

@media (max-width: 1180px) { .dock .badge, .dock .vol { display: none; } }
</style>
</head>
<body class="view-library">
<div class="backdrop"><div class="art on" id="artA"></div><div class="art" id="artB"></div><div class="glow"></div><div class="shade"></div><div class="grain"></div></div>

<div class="app">
  <aside class="sidebar glass">
    <div class="brand" id="brand"></div>
    <button class="search"><i data-i="search" data-s="17"></i><span>Search</span><kbd>Ctrl K</kbd></button>
    <nav class="nav">
      <a><i data-i="home"></i>Home</a>
      <a class="active"><i data-i="disc"></i>Albums<span class="count">214</span></a>
      <a><i data-i="user"></i>Artists</a>
      <a><i data-i="music"></i>Songs</a>
      <a><i data-i="tag"></i>Genres</a>
      <a><i data-i="folder"></i>Folders</a>
    </nav>
    <div class="section-label">Playlists <button title="New playlist"><i data-i="plus" data-s="15"></i></button></div>
    <nav class="playlists" id="playlists"></nav>
    <div class="sidebar-foot">
      <div class="lib-status"><span><b></b>Library up to date</span><small>2,931 songs · 412 GB</small></div>
      <button class="icon-btn" title="Settings"><i data-i="settings" data-s="19"></i></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="circle"><i data-i="chevL" data-s="18"></i></button>
      <button class="circle"><i data-i="chevR" data-s="18"></i></button>
      <div class="spacer"></div>
      <div class="wc"><button><i data-i="minus" data-s="16"></i></button><button><i data-i="square" data-s="14"></i></button><button class="close"><i data-i="x" data-s="16"></i></button></div>
    </header>
    <section class="page">
      <div class="page-head">
        <div><h1>Albums</h1><p>214 albums · 2,931 songs · 8 days of music</p></div>
        <div class="head-actions">
          <button class="pill"><i data-i="sort" data-s="15"></i>Recently added<i data-i="chevD" data-s="15"></i></button>
          <div class="seg"><button class="on"><i data-i="grid" data-s="16"></i></button><button><i data-i="list" data-s="16"></i></button></div>
        </div>
      </div>
      <div class="chips"><button class="chip on">All</button><button class="chip">Hi-Res</button><button class="chip">Dream Pop</button><button class="chip">Electronic</button><button class="chip">Ambient</button><button class="chip">Soul</button><button class="chip">Folk</button><button class="chip">Indie</button><button class="chip">Synthwave</button></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer class="dock glass">
    <div class="np">
      <button class="np-art" data-act="open" title="Open Now Playing"><img id="dockArt" alt=""></button>
      <div class="np-meta"><div class="np-title" id="dockTitle"></div><div class="np-artist" id="dockArtist"></div></div>
      <button class="icon-btn on"><i data-i="heartFill" data-s="18"></i></button>
    </div>
    <div class="transport">
      <div class="controls">
        <button class="icon-btn" data-act="shuffle"><i data-i="shuffle" data-s="18"></i></button>
        <button class="icon-btn" data-act="prev"><i data-i="prev" data-s="20"></i></button>
        <button class="play" data-act="toggle"><span class="pp"></span></button>
        <button class="icon-btn" data-act="next"><i data-i="next" data-s="20"></i></button>
        <button class="icon-btn on" data-act="repeat"><i data-i="repeat" data-s="18"></i></button>
      </div>
      <div class="progress"><span class="t" id="tCur"></span><div class="bar" id="seek"><div class="fill" id="seekFill"></div><div class="knob" id="seekKnob"></div></div><span class="t" id="tLen"></span></div>
    </div>
    <div class="extras">
      <span class="badge" id="dockFmt"></span>
      <button class="icon-btn" data-act="lyrics" title="Lyrics"><i data-i="lyrics" data-s="18"></i></button>
      <button class="icon-btn" data-act="queue" title="Queue"><i data-i="queue" data-s="19"></i></button>
      <button class="icon-btn" title="Output device"><i data-i="device" data-s="18"></i></button>
      <div class="vol"><i data-i="volume" data-s="18"></i><div class="bar"><div class="fill" style="width:72%"></div></div></div>
      <button class="icon-btn" data-act="open" title="Now Playing"><i data-i="expand" data-s="17"></i></button>
    </div>
  </footer>
</div>

<div class="now">
  <header class="now-top">
    <div><button class="circle" data-act="close" title="Back to library"><i data-i="chevD" data-s="18"></i></button></div>
    <div class="from"><small>PLAYING FROM ALBUM</small><b id="fromAlbum"></b></div>
    <div class="right"><button class="circle"><i data-i="mini" data-s="17"></i></button><button class="circle"><i data-i="more" data-s="18"></i></button>
      <div class="wc"><button><i data-i="minus" data-s="16"></i></button><button><i data-i="square" data-s="14"></i></button><button class="close"><i data-i="x" data-s="16"></i></button></div></div>
  </header>
  <div class="now-body">
    <div class="now-left">
      <div class="big-art"><div class="halo" id="halo"></div><img id="bigArt" alt=""></div>
      <div class="now-meta">
        <div><h2 id="nowTitle"></h2><p id="nowSub"></p></div>
        <div class="acts"><button class="circle on"><i data-i="heartFill" data-s="18"></i></button><button class="circle"><i data-i="plus" data-s="18"></i></button></div>
      </div>
      <div>
        <div class="wave" id="wave"></div>
        <div class="times"><span id="nCur"></span><span class="fmt" id="nowFmt"></span><span id="nLeft"></span></div>
      </div>
      <div class="big-controls">
        <button class="icon-btn" data-act="shuffle"><i data-i="shuffle" data-s="22"></i></button>
        <button class="icon-btn" data-act="prev"><i data-i="prev" data-s="28"></i></button>
        <button class="play" data-act="toggle"><span class="pp big"></span></button>
        <button class="icon-btn" data-act="next"><i data-i="next" data-s="28"></i></button>
        <button class="icon-btn on" data-act="repeat"><i data-i="repeat" data-s="22"></i></button>
      </div>
      <div class="now-foot">
        <div class="vol"><i data-i="volume1" data-s="18"></i><div class="bar"><div class="fill" style="width:72%"></div></div><i data-i="volume" data-s="18"></i></div>
        <span class="device"><i data-i="device" data-s="15"></i>Speakers · PipeWire</span>
      </div>
    </div>
    <div class="now-right">
      <div class="tabs glass"><button class="on" data-tab="lyrics">Lyrics</button><button data-tab="queue">Up Next</button><button data-tab="about">About</button></div>
      <div class="lyrics" id="lyrics"><div class="inner" id="lyricsInner"></div></div>
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/covers.js"></script>
<script src="../shared/icons.js"></script>
<script>
(function () {
  const L = LYCHEE, $ = s => document.querySelector(s), body = document.body;
  const shot = L.params.has('shot');
  if (shot) document.documentElement.classList.add('shot');
  const S = Object.assign({}, L.state);
  let album = L.album(S.albumId), tracks = L.tracksFor(album);

  $('#brand').innerHTML = L.logo({ size: 30 }) + '<span>Lychee</span>';

  // Sidebar playlists
  $('#playlists').innerHTML = L.playlists.map(p => `<a>${p.kind === 'liked'
      ? `<span class="pl-art liked">${L.icon('heartFill', { size: 16 })}</span>`
      : `<span class="pl-art">${p.albums.map(id => `<img src="${L.coverURL(id)}" alt="">`).join('')}</span>`}
      <span class="pl-name">${L.esc(p.name)}<small>${p.count} songs</small></span></a>`).join('');

  // Album grid
  $('#grid').innerHTML = L.albums.map(a => `<div class="card" data-id="${a.id}">
      <div class="cv"><img src="${L.coverURL(a)}" alt="" loading="lazy"><span class="eqbadge"><span></span><span></span><span></span></span>
      <span class="playfab">${L.icon('play', { size: 20 })}</span></div>
      <div class="t">${L.esc(a.title)}</div><div class="a">${L.esc(a.artist)}${a.hires ? '<span class="hr">HI-RES</span>' : ''}</div></div>`).join('');

  // Waveform bars
  const WN = 84, wave = L.waveform(WN, 7);
  $('#wave').innerHTML = wave.map(h => `<span style="height:${Math.round(h * 100)}%"></span>`).join('');
  const waveBars = [...$('#wave').children];

  // Lyrics + queue
  function renderLyrics() {
    const t = tracks[S.trackIndex];
    if (album.id === 'tidal-memory' && t.title === 'Saltwater Hymn') {
      $('#lyricsInner').innerHTML = L.lyrics.map((l, i) => `<p data-t="${l.t}">${L.esc(l.text)}</p>`).join('');
    } else {
      $('#lyricsInner').innerHTML = `<div class="empty"><b>No lyrics for this track yet</b><span>Lychee looks for embedded lyrics and .lrc files next to your music.<br>Online lyric providers can plug in here later.</span></div>`;
    }
  }
  $('#queueList').innerHTML = '<div class="q-head">Next from Tidal Memory</div>' + L.queue.map((q, i) => {
    const a = L.album(q.albumId);
    return (i === 3 ? '<div class="q-head">Added by you</div>' : '') + `<div class="q"><img src="${L.coverURL(a)}" alt=""><div><b>${L.esc(q.title)}</b><span>${L.esc(a.artist)}</span></div><time>${L.fmt(q.len)}</time></div>`;
  }).join('');

  let artFlip = false;
  function setAlbum(a, trackIndex) {
    album = a; tracks = L.tracksFor(a); S.trackIndex = trackIndex ?? 0; S.position = trackIndex == null ? 0 : S.position;
    const url = L.coverURL(a);
    const next = artFlip ? $('#artA') : $('#artB'), prev = artFlip ? $('#artB') : $('#artA');
    if (!document.querySelector('.art.on').style.backgroundImage) { prev.style.backgroundImage = `url("${url}")`; }
    else { next.style.backgroundImage = `url("${url}")`; next.classList.add('on'); prev.classList.remove('on'); artFlip = !artFlip; }
    document.documentElement.style.setProperty('--accent', a.accent);
    document.documentElement.style.setProperty('--tint', a.tint);
    $('#dockArt').src = url; $('#bigArt').src = url; $('#halo').style.backgroundImage = `url("${url}")`;
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('playing', c.dataset.id === a.id));
    $('#fromAlbum').textContent = a.title;
    const fmt = a.format + (a.hires ? ' · ' + a.res : ' · ' + a.res);
    $('#dockFmt').textContent = a.format + ' ' + a.short; $('#nowFmt').textContent = fmt;
    renderTrack();
  }
  function renderTrack() {
    const t = tracks[S.trackIndex];
    $('#dockTitle').textContent = t.title; $('#dockArtist').textContent = album.artist;
    $('#nowTitle').textContent = t.title;
    $('#nowSub').innerHTML = `<a href="#">${L.esc(album.artist)}</a> — <a href="#">${L.esc(album.title)}</a>`;
    renderLyrics(); tick(true);
  }
  function renderPlay() {
    document.querySelectorAll('.pp').forEach(el => { el.innerHTML = L.icon(S.playing ? 'pause' : 'play', { size: el.classList.contains('big') ? 30 : 20 }); });
  }
  let lastLine = -1;
  function tick(force) {
    const t = tracks[S.trackIndex], len = t.len, pct = Math.min(1, S.position / len);
    $('#tCur').textContent = L.fmt(S.position); $('#tLen').textContent = L.fmt(len);
    $('#seekFill').style.width = (pct * 100) + '%'; $('#seekKnob').style.left = (pct * 100) + '%';
    $('#nCur').textContent = L.fmt(S.position); $('#nLeft').textContent = '-' + L.fmt(len - S.position);
    waveBars.forEach((b, i) => b.classList.toggle('past', i / WN < pct));
    const lines = [...document.querySelectorAll('#lyricsInner p')];
    let cur = -1; lines.forEach((p, i) => { if (+p.dataset.t <= S.position) cur = i; });
    if (cur !== lastLine || force) {
      lastLine = cur;
      lines.forEach((p, i) => { p.classList.toggle('cur', i === cur); p.classList.toggle('past', i < cur); });
      const box = $('#lyrics');
      if (lines.length && box.clientHeight) {
        const el = lines[Math.max(0, cur)];
        $('#lyricsInner').style.transform = `translateY(${Math.round(box.clientHeight * 0.36 - el.offsetTop - el.offsetHeight / 2)}px)`;
      }
    }
  }
  function seekTo(pct) { S.position = Math.max(0, Math.min(1, pct)) * tracks[S.trackIndex].len; tick(true); }

  document.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) { setAlbum(L.album(card.dataset.id)); S.playing = true; renderPlay(); return; }
    const p = e.target.closest('#lyricsInner p'); if (p) { S.position = +p.dataset.t; tick(true); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab)); body.classList.toggle('view-queue', tab.dataset.tab === 'queue'); return; }
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'toggle') { S.playing = !S.playing; renderPlay(); }
    if (act === 'open' || act === 'lyrics') { body.classList.add('view-now'); body.classList.remove('view-library'); setTimeout(() => tick(true), 60); }
    if (act === 'queue') { body.classList.add('view-now', 'view-queue'); document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === 'queue')); }
    if (act === 'close') { body.classList.remove('view-now'); body.classList.add('view-library'); }
    if (act === 'next') { S.trackIndex = (S.trackIndex + 1) % tracks.length; S.position = 0; renderTrack(); }
    if (act === 'prev') { if (S.position > 3) S.position = 0; else S.trackIndex = (S.trackIndex - 1 + tracks.length) % tracks.length, S.position = 0; renderTrack(); }
    if (act === 'shuffle' || act === 'repeat') document.querySelectorAll(`[data-act="${act}"]`).forEach(b => b.classList.toggle('on'));
  });
  $('#seek').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width); });
  $('#wave').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width); });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); S.playing = !S.playing; renderPlay(); }
    if (e.key === 'Escape') { body.classList.remove('view-now'); body.classList.add('view-library'); }
    if (e.key === 'ArrowRight') { S.position = Math.min(tracks[S.trackIndex].len, S.position + 10); tick(true); }
    if (e.key === 'ArrowLeft') { S.position = Math.max(0, S.position - 10); tick(true); }
  });
  window.addEventListener('resize', () => tick(true));

  L.hydrateIcons(document, { stroke: 1.9 });
  setAlbum(album, S.trackIndex); S.position = L.state.position; renderPlay(); tick(true);
  if (L.params.get('view') === 'now') { body.classList.add('view-now'); body.classList.remove('view-library'); }
  if (L.params.get('tab') === 'queue') { body.classList.add('view-queue'); document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === 'queue')); }
  requestAnimationFrame(() => tick(true));
  if (!shot) setInterval(() => {
    if (!S.playing) return;
    S.position += 0.25;
    if (S.position >= tracks[S.trackIndex].len) { S.trackIndex = (S.trackIndex + 1) % tracks.length; S.position = 0; renderTrack(); }
    tick();
  }, 250);
})();
</script>
</body>
</html>
