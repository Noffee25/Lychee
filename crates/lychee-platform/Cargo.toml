[package]
name = "lychee-platform"
description = "OS media integration for Lychee: MPRIS on Linux, System Media Transport Controls on Windows, Now Playing on macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
tracing.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
mpris-server = "0.10"
async-channel = "2"
futures-lite = "2"

# The same objc2 generation as Slint, winit's helpers, cpal and rfd use, so nothing is duplicated.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
